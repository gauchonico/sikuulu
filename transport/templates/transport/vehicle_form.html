{% extends 'base.html' %}


{% block transport_content %}
{% csrf_token %}
{% for field in form %}
<div class="mb-3">
    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
    {{ field.errors }}
    {{ field }}
    {% if field.help_text %}
    <div class="form-text">{{ field.help_text }}</div>
    {% endif %}
</div>
{% endfor %}
{% endblock %}
